<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新年團圓戳戳樂 - 傳承福氣與回憶</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .animate-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .stamp-effect {
            animation: stamp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes stamp {
            0% { transform: scale(3) rotate(30deg); opacity: 0; }
            100% { transform: scale(1) rotate(15deg); opacity: 1; }
        }
    </style>
</head>
<body class="bg-[#fff5f5]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // 小組件：模擬 Lucide React 圖示 (安全性檢查)
        const Icon = ({ name, size = 24, className = "", fill = "none" }) => {
            const [svg, setSvg] = useState("");
            useEffect(() => {
                if (window.lucide && window.lucide.icons) {
                    const icon = window.lucide.icons[name];
                    if (icon && Array.isArray(icon)) {
                        const baseAttrs = icon[1] || {};
                        const children = icon[2] || [];
                        const attrs = {
                            ...baseAttrs,
                            width: size,
                            height: size,
                            class: className,
                            fill: fill,
                            stroke: "currentColor",
                            "stroke-width": 2,
                            "stroke-linecap": "round",
                            "stroke-linejoin": "round"
                        };
                        const attrString = Object.entries(attrs).map(([k, v]) => `${k}="${v}"`).join(" ");
                        const childrenContent = children.map(child => {
                            if (!Array.isArray(child)) return "";
                            const childTag = child[0];
                            const childAttrs = child[1] || {};
                            const pAttrString = Object.entries(childAttrs).map(([k, v]) => `${k}="${v}"`).join(" ");
                            return `<${childTag} ${pAttrString}></${childTag}>`;
                        }).join("");
                        setSvg(`<svg xmlns="http://www.w3.org/2000/svg" ${attrString}>${childrenContent}</svg>`);
                    }
                }
            }, [name, size, className, fill]);
            return <div dangerouslySetInnerHTML={{ __html: svg }} />;
        };

        // 音效控制
        const playSound = (type) => {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'poke') {
                // 戳破聲 (低沉波一聲)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } else if (type === 'success') {
                // 叮叮聲 (清亮音)
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            }
        };

        const App = () => {
            const [openedHoles, setOpenedHoles] = useState([]);
            const [activeHole, setActiveHole] = useState(null);
            const [gameState, setGameState] = useState('grid'); 

            const topics = [
                { id: 1, name: '紅包壓歲錢', story: '紅包袋的紅色代表吉利。以前長輩給壓歲錢是為了壓住邪氣，希望孩子新的一年平平安安、快快樂樂長大！' },
                { id: 2, name: '年年有餘', story: '吃年夜飯時，魚肉不能全部吃完。剩下一點點代表家裡的財富與福氣「年年有餘」，每年都有存項。' },
                { id: 3, name: '步步高升', story: '過年必吃的「年糕」，發音與「年高」相同。吃年糕象徵新的一年，地位、學業或身體狀況都能一年比一年高。' },
                { id: 4, name: '發財元寶', story: '過年吃餃子，是因為餃子的形狀長得像金元寶。吃餃子代表把財富吃進去，新的一年財源廣進。' },
                { id: 5, name: '嚇走年獸', story: '傳說過年放鞭炮、貼紅對聯，是為了嚇跑「年獸」。用喜慶的紅色跟巨大的聲響來守護家園。' },
                { id: 6, name: '長年菜', story: '吃長年菜（芥菜）時不能咬斷，要整葉吃下去。這代表壽命長長久久、福氣延綿不斷。' },
                { id: 7, name: '守歲祈福', story: '除夕夜陪父母聊天到深夜稱作「守歲」。這份心意是為了幫父母祈求長壽，讓全家人聚在一起分享溫暖。' },
                { id: 8, name: '大掃除', story: '過年前要大掃除「去舊迎新」。但初一通常不能掃地，是怕把剛進門的財氣與福氣給掃出去了。' },
                { id: 9, name: '大吉大利', story: '過年桌上擺放橘子，是因為「橘」與「吉」諧音。象徵新的一年事事大吉大利，平安順利。' },
                { id: 10, name: '走春拜年', story: '大年初一出門向親友拜訪稱作「走春」。這是到戶外吸取春天的喜氣，開啟整年的好運勢。' },
                { id: 11, name: '回娘家', story: '初二是回娘家的日子。出嫁的女兒會帶著豐盛的伴手禮回去探望父母，分享一年的喜悅。' },
                { id: 12, name: '吃甜甜', story: '過年常說「吃甜甜，大賺錢」。吃口糖果或甜食，祈求新的一年生活甜蜜蜜、財運滾滾來。' },
                { id: 13, name: '發財發粿', story: '發粿外皮裂開越多代表運勢越「發」。那裂痕被稱為「笑」，笑得越開心，來年財富就越旺。' },
                { id: 14, name: '吉祥瓜子', story: '以前過年常嗑紅瓜子（西瓜籽）。「嗑」的聲音象徵熱鬧，紅色的外殼更是增添了許多喜氣。' },
                { id: 15, name: '迎財神', story: '正月初五是五路財神的生日。商家通常在這天開工，迎接財神進門，保佑生意興隆、通四海。' },
                { id: 16, name: '元宵節', story: '正月十五是元宵節，又稱小過年。大家吃湯圓、提燈籠，為熱鬧的新年畫下完美的句點。' }
            ];

            const handlePoke = (index) => {
                if (openedHoles.includes(index)) return;
                const hole = topics[index];
                setActiveHole(hole);
                setOpenedHoles(prev => [...prev, index]);
                setGameState('story');
                
                // 播放音效
                playSound('poke');
                setTimeout(() => playSound('success'), 200);
            };

            const resetGame = () => {
                setOpenedHoles([]);
                setGameState('grid');
                setActiveHole(null);
            };

            return (
                <div className="min-h-screen bg-[#fff5f5] p-4 md:p-8 select-none">
                    <div className="max-w-2xl mx-auto">
                        <header className="text-center mb-10">
                            <h1 className="text-4xl md:text-5xl font-black text-red-800 mb-2 flex items-center justify-center gap-3">
                                <Icon name="Gift" className="text-red-600 animate-bounce" size={48} />
                                新年團圓戳戳樂
                            </h1>
                            <p className="text-2xl text-amber-900 font-bold opacity-80">戳開驚喜、回味習俗、全家團圓</p>
                            <div className="mt-6">
                                <div className="inline-block bg-white px-10 py-4 rounded-full shadow-xl border-4 border-red-200 font-black text-3xl text-red-700">
                                    福氣進門：{openedHoles.length} / 16
                                </div>
                            </div>
                        </header>

                        {/* 遊戲網格 */}
                        {gameState === 'grid' && (
                            <div className="grid grid-cols-4 gap-4 md:gap-8 bg-red-100/20 p-6 rounded-[50px] shadow-inner border-2 border-red-50 animate-in">
                                {topics.map((attr, index) => {
                                    const isOpened = openedHoles.includes(index);
                                    return (
                                        <button
                                            key={index}
                                            onClick={() => handlePoke(index)}
                                            disabled={isOpened}
                                            className={`
                                                relative aspect-square rounded-[32px] transition-all duration-500
                                                ${isOpened 
                                                    ? 'bg-stone-200 border-stone-300 border-b-2 scale-95 shadow-[inset_0_4px_10px_rgba(0,0,0,0.1)]' 
                                                    : 'bg-gradient-to-br from-red-600 to-orange-600 hover:from-red-500 hover:to-orange-500 active:scale-90 border-red-800 border-b-[12px] hover:shadow-[0_20px_40px_-10px_rgba(185,28,28,0.4)]'
                                                }
                                                flex flex-col items-center justify-center overflow-visible group
                                            `}
                                        >
                                            {isOpened ? (
                                                <div className="flex flex-col items-center justify-center w-full h-full relative">
                                                    <Icon name="Heart" className="text-red-600 mb-1 opacity-50" size={24} fill="currentColor" />
                                                    <span className="text-[10px] md:text-xs font-black text-stone-600 text-center px-1 leading-tight">{attr.name}</span>
                                                    <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-20">
                                                        <div className="stamp-effect border-[6px] border-orange-500 bg-white/10 text-orange-600 font-black text-xl md:text-2xl px-3 py-1 rounded-2xl shadow-lg backdrop-blur-[1px]">
                                                            賀新年
                                                        </div>
                                                    </div>
                                                </div>
                                            ) : (
                                                <>
                                                    <span className="text-4xl md:text-6xl font-black text-white/50 group-hover:text-white/80 transition-all drop-shadow-md">{index + 1}</span>
                                                    <div className="absolute top-2 right-2">
                                                        <Icon name="Sparkles" className="text-yellow-300 opacity-40 group-hover:opacity-100" size={20} />
                                                    </div>
                                                </>
                                            )}
                                        </button>
                                    );
                                })}
                            </div>
                        )}

                        {/* 習俗故事畫面 */}
                        {gameState === 'story' && activeHole && (
                            <div className="bg-white rounded-[60px] p-10 shadow-2xl border-b-[24px] border-yellow-400 animate-in">
                                <div className="text-center">
                                    <div className="bg-red-50 p-8 rounded-[40px] border-4 border-red-100 shadow-sm mb-10 flex items-center justify-center gap-6">
                                        <Icon name="Star" size={60} fill="#facc15" className="text-yellow-400" />
                                        <h2 className="text-6xl font-black text-red-800">{activeHole.name}</h2>
                                        <Icon name="Star" size={60} fill="#facc15" className="text-yellow-400" />
                                    </div>

                                    <div className="bg-amber-50 p-10 rounded-[50px] border-4 border-amber-100 text-left shadow-inner mb-14">
                                        <h3 className="text-3xl font-black text-amber-900 mb-6 flex items-center gap-4">
                                            🏮 習俗小知識
                                        </h3>
                                        <p className="text-3xl md:text-4xl text-stone-700 font-bold leading-relaxed">
                                            {activeHole.story}
                                        </p>
                                    </div>

                                    <button
                                        onClick={() => setGameState('grid')}
                                        className="bg-red-700 text-white text-4xl font-black px-24 py-10 rounded-[50px] shadow-2xl hover:bg-red-800 active:scale-95 transition-all w-full md:w-auto border-b-[14px] border-red-900"
                                    >
                                        收下福氣，繼續戳！
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* 重置按鈕 */}
                        {gameState === 'grid' && openedHoles.length > 0 && (
                            <div className="mt-20 text-center">
                                <button
                                    onClick={resetGame}
                                    className="px-16 py-6 bg-white border-2 border-red-200 rounded-full text-stone-600 font-black hover:bg-red-50 hover:text-red-700 transition-all text-3xl flex items-center gap-4 mx-auto shadow-md"
                                >
                                    <Icon name="RotateCcw" size={36} />
                                    重新開始遊戲
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
